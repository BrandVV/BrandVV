<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <filter id="orange-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FF8C00" flood-opacity="0.35"/>
    </filter>

    <pattern id="hex" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 2 L58 15 L58 45 L30 58 L2 45 L2 15 Z" fill="none" stroke="#2A2A2A" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="20" y="20" width="calc(100% - 40px)" height="calc(100% - 40px)" rx="12" fill="#141414" stroke="#6B6B6B" stroke-width="2" filter="url(#orange-glow)" />

  <rect x="20" y="20" width="calc(100% - 40px)" height="calc(100% - 40px)" rx="12" fill="url(#hex)" />
</svg>
